[workspace]
resolver = "2"
members = [
    "crates/qf-math",
    "crates/qf-circuit",
    "crates/qf-sim-statevec",
    "crates/qf-sim-stabilizer",
    "crates/qf-noise",
    "crates/qf-topology",
    "crates/qf-qec-surface",
    "crates/qf-qec-ldpc",
    "crates/qf-logical",
    "crates/qf-scheduler",
    "crates/qf-agent",
    "crates/qf-api",
    "crates/qf-cli",
    "crates/qf-ui-spec",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yablokolabs/quantaforge"

[workspace.dependencies]
# Math / numerics
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Graph / topology
petgraph = "0.7"

# Web / API
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"
